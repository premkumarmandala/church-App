<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastoral Prayer Admin Portal - Grace Fellowship Church</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Master Design System Tokens & Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../design-tokens.css">

  <!-- React 18 & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --navy: var(--color-primary-800);
      --navy-dark: var(--color-primary-950);
      --navy-light: var(--color-primary-700);
      --gold: var(--color-gold-500);
      --gold-light: var(--color-gold-400);
      --blue: var(--color-action);
      --blue-hover: var(--color-action-hover);
      --bg: var(--color-bg-page);
      --card-bg: var(--color-surface);
      --text: var(--color-text-primary);
      --text-muted: var(--color-text-muted);
      --border: var(--color-border);
      --border-subtle: var(--color-border-subtle);
      --success: var(--color-success);
      --warning: var(--color-warning);
      --danger: var(--color-danger);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: var(--leading-normal);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Admin Header */
    .admin-header {
      background: var(--navy-dark);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-md);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .admin-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }
    .admin-brand-logo {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: var(--navy);
      border: 1px solid rgba(197, 155, 39, 0.35);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .admin-brand-text {
      display: flex;
      flex-direction: column;
    }
    .admin-brand-title {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }
    .admin-brand-sub {
      font-size: 0.75rem;
      color: var(--gold-light);
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .btn-logout {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      padding: 7px 16px;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-size: var(--text-sm);
      font-weight: 600;
      transition: all var(--transition-fast);
      min-height: 36px;
    }
    .btn-logout:hover {
      background: rgba(255,255,255,0.18);
      border-color: #fff;
    }

    .admin-container {
      max-width: var(--container-max);
      margin: 28px auto 60px auto;
      padding: 0 var(--container-pad);
    }

    /* Login Card */
    .login-wrapper {
      max-width: 440px;
      margin: 80px auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      box-shadow: var(--shadow-card);
    }
    .login-logo-badge {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: var(--navy);
      border: 1px solid rgba(197, 155, 39, 0.4);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      margin: 0 auto 16px auto;
      box-shadow: 0 4px 12px rgba(15, 30, 54, 0.2);
    }
    .login-title {
      font-family: var(--font-display);
      color: var(--navy);
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
    }
    .login-subtitle {
      color: var(--text-muted);
      font-size: 0.92rem;
      text-align: center;
      margin-bottom: 24px;
    }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--color-text-secondary);
    }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: #fff;
      transition: all var(--transition-fast);
      min-height: 42px;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.18);
    }
    .btn-primary {
      width: 100%;
      background: var(--blue);
      color: #fff;
      padding: 12px;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: 0 2px 8px rgba(0, 102, 204, 0.25);
      min-height: 44px;
    }
    .btn-primary:hover {
      background: var(--blue-hover);
      box-shadow: 0 4px 12px rgba(0, 102, 204, 0.35);
    }
    .login-error {
      background: var(--color-danger-bg);
      border: 1px solid var(--color-danger-border);
      color: var(--danger);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      margin-bottom: 18px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
      transition: transform var(--transition-base), box-shadow var(--transition-base);
    }
    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .stat-card.card-total { border-top: 4px solid var(--navy); }
    .stat-card.card-pending { border-top: 4px solid var(--warning); }
    .stat-card.card-prayed { border-top: 4px solid var(--success); }
    .stat-card.card-archived { border-top: 4px solid var(--text-muted); }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--navy);
      line-height: 1.1;
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* Filters Bar */
    .filters-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      align-items: center;
      box-shadow: var(--shadow-xs);
    }
    .search-input {
      flex: 1;
      min-width: 260px;
    }

    /* Requests Cards */
    .requests-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .request-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      box-shadow: var(--shadow-sm);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .request-card:hover {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-md);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .ref-badge {
      font-family: monospace;
      font-weight: 700;
      background: var(--color-surface-subtle);
      color: var(--navy);
      padding: 4px 10px;
      border-radius: var(--radius-xs);
      font-size: 0.85rem;
      border: 1px solid var(--border);
    }
    .status-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .status-pending { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .status-prayed { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .status-archived { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }

    .req-message {
      font-size: 1.02rem;
      color: var(--color-text-secondary);
      margin-bottom: 16px;
      white-space: pre-wrap;
      line-height: var(--leading-relaxed);
    }
    .req-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 14px;
      align-items: center;
    }
    .req-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .attachments-box {
      margin: 14px 0;
      background: var(--color-surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
    }
    .attachment-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
      margin-top: 6px;
    }
    .card-actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }
    .btn-sm {
      padding: 7px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--color-text-secondary);
      transition: all var(--transition-fast);
      min-height: 34px;
      display: inline-flex;
      align-items: center;
    }
    .btn-sm:hover {
      background: var(--color-surface-hover);
      border-color: #cbd5e1;
    }
    .btn-status-prayed {
      background: #ecfdf5;
      color: #047857;
      border-color: #a7f3d0;
    }
    .btn-status-prayed:hover {
      background: #d1fae5;
    }
    .btn-delete {
      color: var(--danger);
    }
    .btn-delete:hover {
      background: var(--color-danger-bg);
      border-color: var(--color-danger-border);
    }

    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: 1fr; }
      .card-actions { margin-left: 0; width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function AdminApp() {
      const [token, setToken] = useState(() => localStorage.getItem("pastoral_admin_token") || "");
      const [username, setUsername] = useState("pastor");
      const [password, setPassword] = useState("");
      const [loginError, setLoginError] = useState("");
      const [requests, setRequests] = useState([]);
      const [stats, setStats] = useState(null);
      const [loading, setLoading] = useState(false);
      const [search, setSearch] = useState("");
      const [statusFilter, setStatusFilter] = useState("");
      const [categoryFilter, setCategoryFilter] = useState("");

      const apiBase = (window.location.origin && window.location.origin.includes(":8000")) ? "" : "http://localhost:8000";

      // Login handler
      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError("");
        try {
          const res = await fetch(`${apiBase}/api/admin/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
          });
          if (!res.ok) {
            setLoginError("Invalid username or password.");
            return;
          }
          const data = await res.json();
          setToken(data.access_token);
          localStorage.setItem("pastoral_admin_token", data.access_token);
        } catch (err) {
          setLoginError("Could not reach backend server.");
        }
      };

      // Logout handler
      const handleLogout = () => {
        setToken("");
        localStorage.removeItem("pastoral_admin_token");
      };

      // Fetch Requests & Stats
      const fetchDashboardData = async () => {
        if (!token) return;
        setLoading(true);
        try {
          // Fetch stats
          const statsRes = await fetch(`${apiBase}/api/admin/prayer-requests/stats`, {
            headers: { "Authorization": `Bearer ${token}` }
          });
          if (statsRes.status === 401) {
            handleLogout();
            return;
          }
          if (statsRes.ok) {
            setStats(await statsRes.json());
          }

          // Build query URL
          const params = new URLSearchParams();
          if (statusFilter) params.append("status", statusFilter);
          if (categoryFilter) params.append("category", categoryFilter);
          if (search) params.append("q", search);

          const listRes = await fetch(`${apiBase}/api/admin/prayer-requests?${params.toString()}`, {
            headers: { "Authorization": `Bearer ${token}` }
          });
          if (listRes.ok) {
            const listData = await listRes.json();
            setRequests(listData.requests || []);
          }
        } catch (err) {
          console.error("Dashboard fetch error:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (token) {
          fetchDashboardData();
        }
      }, [token, statusFilter, categoryFilter]);

      // Update status
      const handleUpdateStatus = async (requestId, newStatus) => {
        try {
          const res = await fetch(`${apiBase}/api/admin/prayer-requests/${requestId}`, {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({ status: newStatus })
          });
          if (res.ok) {
            fetchDashboardData();
          }
        } catch (err) {
          alert("Error updating status: " + err);
        }
      };

      // Delete request
      const handleDelete = async (requestId) => {
        if (!confirm("Are you sure you want to delete this prayer request?")) return;
        try {
          const res = await fetch(`${apiBase}/api/admin/prayer-requests/${requestId}`, {
            method: "DELETE",
            headers: { "Authorization": `Bearer ${token}` }
          });
          if (res.ok) {
            fetchDashboardData();
          }
        } catch (err) {
          alert("Error deleting request: " + err);
        }
      };

      // If not logged in -> show login form
      if (!token) {
        return (
          <div className="login-wrapper">
            <div className="login-logo-badge">✝</div>
            <h1 className="login-title">Pastoral Portal</h1>
            <p className="login-subtitle">Sign in to manage church prayer intercession</p>
            {loginError && <div className="login-error">{loginError}</div>}
            <form onSubmit={handleLogin}>
              <div className="form-group">
                <label>Pastoral Username</label>
                <input
                  type="text"
                  className="form-control"
                  value={username}
                  onChange={(e) => setUsername(e.target.value)}
                  required
                />
              </div>
              <div className="form-group">
                <label>Password</label>
                <input
                  type="password"
                  className="form-control"
                  placeholder="Enter administrator password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  required
                />
              </div>
              <button type="submit" className="btn-primary">Sign In to Dashboard</button>
            </form>
          </div>
        );
      }

      // Logged in Dashboard
      return (
        <div>
          <header className="admin-header">
            <a href="index.html" className="admin-brand">
              <div className="admin-brand-logo">✝</div>
              <div className="admin-brand-text">
                <span className="admin-brand-title">Grace Fellowship Church</span>
                <span className="admin-brand-sub">Pastoral Care & Intercession</span>
              </div>
            </a>
            <div style={{ display: "flex", gap: "12px", alignItems: "center" }}>
              <a href="index.html" style={{ color: "rgba(255,255,255,0.8)", fontSize: "0.88rem", textDecoration: "none", fontWeight: 500 }}>
                &larr; View Public Form
              </a>
              <button className="btn-logout" onClick={handleLogout}>Log Out</button>
            </div>
          </header>

          <main className="admin-container">
            {/* Stats Overview */}
            {stats && (
              <div className="stats-grid">
                <div className="stat-card card-total">
                  <div className="stat-value">{stats.total_requests}</div>
                  <div className="stat-label">Total Requests</div>
                </div>
                <div className="stat-card card-pending">
                  <div className="stat-value" style={{ color: "var(--warning)" }}>{stats.pending_requests}</div>
                  <div className="stat-label">Pending Intercession</div>
                </div>
                <div className="stat-card card-prayed">
                  <div className="stat-value" style={{ color: "var(--success)" }}>{stats.prayed_requests}</div>
                  <div className="stat-label">Prayed & Interceded</div>
                </div>
                <div className="stat-card card-archived">
                  <div className="stat-value" style={{ color: "var(--text-muted)" }}>{stats.archived_requests}</div>
                  <div className="stat-label">Archived</div>
                </div>
              </div>
            )}

            {/* Filter Bar */}
            <div className="filters-bar">
              <input
                type="text"
                className="form-control search-input"
                placeholder="Search by keyword, name, or reference ID..."
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && fetchDashboardData()}
              />
              <button className="btn-sm" onClick={fetchDashboardData}>Search</button>

              <select
                className="form-control"
                style={{ width: "160px" }}
                value={statusFilter}
                onChange={(e) => setStatusFilter(e.target.value)}
              >
                <option value="">All Statuses</option>
                <option value="Pending">Pending</option>
                <option value="Prayed">Prayed</option>
                <option value="Archived">Archived</option>
              </select>

              <select
                className="form-control"
                style={{ width: "200px" }}
                value={categoryFilter}
                onChange={(e) => setCategoryFilter(e.target.value)}
              >
                <option value="">All Categories</option>
                <option value="Healing & Health">Healing & Health</option>
                <option value="Family & Relationships">Family & Relationships</option>
                <option value="Spiritual Growth">Spiritual Growth</option>
                <option value="Financial Breakthrough">Financial Breakthrough</option>
                <option value="Peace & Mental Comfort">Peace & Mental Comfort</option>
                <option value="Guidance & Wisdom">Guidance & Wisdom</option>
                <option value="Praise & Thanksgiving">Praise & Thanksgiving</option>
                <option value="Other Needs">Other Needs</option>
              </select>

              <button className="btn-sm" onClick={() => { setSearch(""); setStatusFilter(""); setCategoryFilter(""); }}>
                Reset
              </button>
            </div>

            {/* Requests List */}
            {loading ? (
              <p style={{ textAlign: "center", color: "var(--text-muted)", margin: "40px 0" }}>Loading prayer requests from PostgreSQL...</p>
            ) : requests.length === 0 ? (
              <div style={{ textAlign: "center", padding: "60px 20px", background: "#fff", borderRadius: "var(--radius-lg)", border: "1px solid var(--border)" }}>
                <p style={{ fontSize: "1.1rem", color: "var(--text-muted)" }}>No prayer requests found matching your filters.</p>
              </div>
            ) : (
              <div className="requests-list">
                {requests.map((req) => (
                  <article key={req.id} className="request-card">
                    <div className="card-top">
                      <div style={{ display: "flex", gap: "10px", alignItems: "center" }}>
                        <span className="ref-badge">{req.id}</span>
                        <span style={{ fontWeight: "700", color: "var(--navy)" }}>{req.category}</span>
                        {req.is_anonymous && (
                          <span style={{ background: "var(--color-surface-subtle)", fontSize: "0.75rem", padding: "2px 8px", borderRadius: "4px", color: "var(--text-muted)", fontWeight: "600" }}>
                            Anonymous Requester
                          </span>
                        )}
                      </div>
                      <span className={`status-badge status-${req.status.toLowerCase()}`}>
                        {req.status}
                      </span>
                    </div>

                    <p className="req-message">{req.message}</p>

                    {/* Attachments Section */}
                    {req.attachments && req.attachments.length > 0 && (
                      <div className="attachments-box">
                        <strong style={{ fontSize: "0.82rem", color: "var(--color-text-secondary)" }}>
                          Attachments ({req.attachments.length}):
                        </strong>
                        {req.attachments.map((att) => (
                          <div key={att.id} className="attachment-item">
                            <span>
                              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ verticalAlign: "-2px", marginRight: "4px" }}><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                              {att.original_filename} ({att.file_type})
                            </span>
                            {att.file_type === "audio" && (
                              <audio
                                controls
                                src={`${apiBase}${att.download_url}?token=${token}`}
                                style={{ height: "30px", marginLeft: "10px" }}
                              />
                            )}
                            <a
                              href={`${apiBase}${att.download_url}?token=${token}`}
                              target="_blank"
                              rel="noreferrer"
                              style={{ color: "var(--blue)", fontSize: "0.82rem", marginLeft: "8px", fontWeight: "600" }}
                            >
                              Download / Open
                            </a>
                          </div>
                        ))}
                      </div>
                    )}

                    {/* Pastoral Notes if present */}
                    {req.pastoral_notes && (
                      <div style={{ background: "var(--color-warning-bg)", borderLeft: "3px solid var(--warning)", padding: "10px 14px", margin: "12px 0", fontSize: "0.88rem", borderRadius: "var(--radius-xs)" }}>
                        <strong>Pastoral Notes:</strong> {req.pastoral_notes}
                      </div>
                    )}

                    <div className="req-meta">
                      <span className="req-meta-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        {req.name || "Anonymous"}
                      </span>
                      {req.email && (
                        <span className="req-meta-item">
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                          {req.email}
                        </span>
                      )}
                      {req.phone && (
                        <span className="req-meta-item">
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                          {req.phone}
                        </span>
                      )}
                      <span className="req-meta-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        {new Date(req.created_at).toLocaleString()}
                      </span>
                      <span className="req-meta-item" style={{ color: req.contact_permission ? "var(--success)" : "var(--text-muted)" }}>
                        {req.contact_permission ? "✓ Follow-up allowed" : "✕ Confidential"}
                      </span>

                      <div className="card-actions">
                        {req.status !== "Prayed" && (
                          <button
                            className="btn-sm btn-status-prayed"
                            onClick={() => handleUpdateStatus(req.id, "Prayed")}
                          >
                            Mark Prayed
                          </button>
                        )}
                        {req.status !== "Archived" && (
                          <button
                            className="btn-sm"
                            onClick={() => handleUpdateStatus(req.id, "Archived")}
                          >
                            Archive
                          </button>
                        )}
                        <button
                          className="btn-sm btn-delete"
                          onClick={() => handleDelete(req.id)}
                        >
                          Delete
                        </button>
                      </div>
                    </div>
                  </article>
                ))}
              </div>
            )}
          </main>
        </div>
      );
    }

    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<AdminApp />);
  </script>
</body>
</html>
