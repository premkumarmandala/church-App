    /* ==========================================================================
       1. Navbar Component
       ========================================================================== */
    function Navbar({ activeSection = "home", onNavigate }) {
      const [isScrolled, setIsScrolled] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      useEffect(() => {
        const handleScroll = () => {
          if (window.scrollY > 20) {
            setIsScrolled(true);
          } else {
            setIsScrolled(false);
          }
        };

        window.addEventListener("scroll", handleScroll, { passive: true });
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);

      const navItems = [
        { id: "home", label: "Home", href: "#home" },
        { id: "about", label: "About", href: "#service-timings" },
        { id: "bible", label: "Bible", href: "bible/index.html" },
        { id: "prayer", label: "Prayer", href: "prayer-request/index.html" },
        { id: "contact", label: "Contact", href: "#contact" }
      ];

      const handleLinkClick = (id, href, e) => {
        if (href.startsWith("#")) {
          e.preventDefault();
          setMobileMenuOpen(false);
          if (onNavigate) onNavigate(id);
          const target = document.getElementById(href.substring(1));
          if (target) {
            target.scrollIntoView({ behavior: "smooth" });
          }
        }
      };

      return (
        <header className={`church-navbar ${isScrolled ? "scrolled" : ""}`}>
          <div className="navbar-inner">
            {/* Brand */}
            <a href="#home" className="nav-brand" onClick={(e) => handleLinkClick("home", "#home", e)}>
              <div className="nav-brand-logo">
                <span className="nav-cross-icon">✝</span>
              </div>
              <div className="nav-brand-text">
                <span className="nav-church-name">Grace Fellowship Church</span>
                <span className="nav-church-tagline">Worship • Grow • Serve • Share</span>
              </div>
            </a>

            {/* Desktop Navigation */}
            <nav className="nav-links-desktop" aria-label="Main Navigation">
              {navItems.map((item) => (
                <li key={item.id} className="nav-link-item">
                  <a
                    href={item.href}
                    className={`nav-link-btn ${activeSection === item.id ? "active" : ""}`}
                    onClick={(e) => handleLinkClick(item.id, item.href, e)}
                  >
                    {item.label}
                  </a>
                </li>
              ))}

              {/* Donate Button */}
              <a
                href="#contact"
                className="btn-nav-donate"
                onClick={(e) => handleLinkClick("contact", "#contact", e)}
              >
                Donate
              </a>
            </nav>

            {/* Mobile Hamburger Toggle */}
            <button
              type="button"
              className="hamburger-toggle"
              aria-label="Toggle navigation menu"
              aria-expanded={mobileMenuOpen}
              onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
            >
              <span className="hamburger-bar" />
              <span className="hamburger-bar" />
              <span className="hamburger-bar" />
            </button>
          </div>

          {/* Mobile Drawer Menu */}
          <div className={`mobile-nav-drawer ${mobileMenuOpen ? "open" : ""}`} aria-hidden={!mobileMenuOpen}>
            <ul className="mobile-nav-list">
              {navItems.map((item) => (
                <li key={item.id}>
                  <a
                    href={item.href}
                    className={activeSection === item.id ? "active" : ""}
                    onClick={(e) => handleLinkClick(item.id, item.href, e)}
                  >
                    {item.label}
                  </a>
                </li>
              ))}
              <li style={{ marginTop: "8px" }}>
                <a
                  href="#contact"
                  className="btn-nav-donate"
                  style={{ display: "inline-block", textAlign: "center", width: "100%" }}
                  onClick={(e) => handleLinkClick("contact", "#contact", e)}
                >
                  Donate Online 💝
                </a>
              </li>
            </ul>
          </div>
        </header>
      );
    }

    /* ==========================================================================
       4. VerseOfTheDay Component
       ========================================================================== */
    function VerseOfTheDay() {
      const [verse, setVerse] = useState({
        text: "The Lord is my shepherd; I shall not want.",
        reference: "Psalm 23:1 (KJV)",
        book: "psalms",
        chapter: 23,
        verseNum: 1
      });

      useEffect(() => {
        let isMounted = true;
        const fetchDailyVerse = async () => {
          try {
            const apiBase = window.API_BASE_URL || (window.location.protocol === "file:" ? "http://localhost:8000" : "");
            const res = await fetch(`${apiBase}/api/bible/daily-verse`);
            if (res.ok && isMounted) {
              const data = await res.json();
              if (data && data.kjvText) {
                setVerse({
                  text: data.kjvText,
                  reference: `${data.bookName || data.book} ${data.chapter}:${data.verse} (KJV)`,
                  book: data.book,
                  chapter: data.chapter,
                  verseNum: data.verse
                });
              }
            }
          } catch (err) {
            console.log("Verse of the day fallback active");
          }
        };

        fetchDailyVerse();
        return () => {
          isMounted = false;
        };
      }, []);

      return (
        <section id="verse-of-the-day" className="home-container" style={{ marginTop: "24px" }}>
          <div className="votd-card">
            {/* Left Visual: Open Bible Photo */}
            <div className="votd-left-visual">
              <img
                src="home/assets/open_bible_banner.jpg"
                alt="Holy Bible Open Scripture"
                className="votd-bible-img"
                loading="eager"
              />
            </div>

            {/* Center Content */}
            <div className="votd-content">
              <div className="votd-header">
                <span className="votd-header-icon">📖</span>
                <span className="votd-header-title">Verse of the Day</span>
              </div>
              <p className="votd-text">
                “{verse.text}”
              </p>
              <p className="votd-reference">{verse.reference}</p>
            </div>

            {/* Right CTA Button */}
            <a
              href="bible/index.html"
              className="btn-votd-read"
              title="Study this verse in the Online Bible reader"
            >
              <span>Read in Bible</span>
              <span>➔</span>
            </a>
          </div>
        </section>
      );
    }

    /* ==========================================================================
       Master HomePage Component
       ========================================================================== */
    function HomePage() {
      const [activeSection, setActiveSection] = useState("home");

      useEffect(() => {
        const sectionIds = [
          "home",
          "announcements",
          "verse-of-the-day",
          "service-timings",
          "sermons",
          "events",
          "ministries",
          "contact"
        ];

        const handleScroll = () => {
          const scrollPos = window.scrollY + 160;
          for (const id of sectionIds) {
            const el = document.getElementById(id);
            if (el) {
              const top = el.offsetTop;
              const height = el.offsetHeight;
              if (scrollPos >= top && scrollPos < top + height) {
                if (id === "service-timings") {
                  setActiveSection("about");
                } else if (id === "verse-of-the-day") {
                  setActiveSection("home");
                } else {
                  setActiveSection(id);
                }
                break;
              }
            }
          }
        };

        window.addEventListener("scroll", handleScroll, { passive: true });
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);

      return (
        <div className="church-app-root">
          <Navbar
            activeSection={activeSection}
            onNavigate={(sec) => setActiveSection(sec)}
          />
          <main>
            <Hero />
            <Announcements />
            <VerseOfTheDay />
            <ServiceTimings />
            <LatestSermons />
            <UpcomingEvents />
            <Ministries />
            <ChurchLocation />
          </main>
          <Footer />
        </div>
      );
    }

    // Render the React Home Page to #root
    const rootElement = document.getElementById("root");
    const reactRoot = ReactDOM.createRoot(rootElement);
    reactRoot.render(<HomePage />);
  </script>
