<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grace Fellowship Church - Worship • Grow • Serve • Share</title>
  <meta name="description" content="Welcome to Grace Fellowship Church. A family of believers growing together in Christ's love. Join us for Sunday worship, service timings, announcements, and online Bible study.">
  <meta name="theme-color" content="#ffffff">

  <!-- OpenGraph / Social Metadata -->
  <meta property="og:title" content="Grace Fellowship Church - Worship • Grow • Serve • Share">
  <meta property="og:description" content="A family of believers growing together in Christ's love.">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f1e36%22/><text y=%2270%22 x=%2250%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22%23c59b27%22 font-family=%22sans-serif%22 font-weight=%22bold%22>✝</text></svg>">

  <!-- Typography matching Design System -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Master Design System Tokens & Home Stylesheet -->
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="home/home.css">

  <!-- React 18 & ReactDOM 18 from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for in-browser JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

  <!-- React Root Container -->
  <div id="root">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; color: #64748b; background: #ffffff;">
      <div style="text-align: center;">
        <div style="font-size: 2.2rem; margin-bottom: 12px; color: #c59b27;">✝</div>
        <p style="font-size: 1.05rem; font-weight: 700; color: #0f1e36;">Loading Grace Fellowship Church...</p>
      </div>
    </div>
  </div>

  <!-- Load Dynamic Church Public Home Website Bundle -->
  <script type="text/babel" src="./home/home.bundle.jsx"></script>

  <!-- Mount Root Application -->
  <script type="text/babel">
    function mountHomeApp() {
      const rootElement = document.getElementById("root");
      if (!rootElement) return;

      const App = window.HomePage;
      if (App) {
        const reactRoot = ReactDOM.createRoot(rootElement);
        reactRoot.render(<App />);
      } else {
        setTimeout(mountHomeApp, 50);
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", mountHomeApp);
    } else {
      mountHomeApp();
    }
  </script>

</body>
</html>
