<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grace Fellowship Church - Worship • Grow • Serve • Share</title>
  <meta name="description" content="Welcome to Grace Fellowship Church. A family of believers growing together in Christ's love. Join us for Sunday worship, service timings, announcements, and online Bible study.">
  <meta name="theme-color" content="#ffffff">

  <!-- OpenGraph / Social Metadata -->
  <meta property="og:title" content="Grace Fellowship Church - Worship • Grow • Serve • Share">
  <meta property="og:description" content="A family of believers growing together in Christ's love.">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f1e36%22/><text y=%2270%22 x=%2250%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22%23c59b27%22 font-family=%22sans-serif%22 font-weight=%22bold%22>✝</text></svg>">

  <!-- Typography matching Design System -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Master Design System Tokens & Home Stylesheet -->
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="home/home.css">

  <!-- React 18 & ReactDOM 18 from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>

  <!-- React Root Container -->
  <div id="root">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; color: #64748b; background: #faf9f6;">
      <div style="text-align: center;">
        <div style="margin-bottom: 12px; display: inline-flex; justify-content: center; color: #c59b27;">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 2h4v6h6v4h-6v10h-4V12H4V8h6V2z" />
          </svg>
        </div>
        <p style="font-size: 1.05rem; font-weight: 700; color: #0f1e36;">Loading Grace Fellowship Church...</p>
      </div>
    </div>
  </div>

  <!-- Load Pre-Compiled Dynamic Church Public Home Website Bundle -->
  <script src="./home/home.bundle.js?v=2"></script>

  <!-- Mount Root Application Fallback -->
  <script>
    function mountHomeApp() {
      if (window.__HOME_MOUNTED__) return;
      const rootElement = document.getElementById("root");
      if (!rootElement) return;

      const App = window.HomePage;
      if (App && window.ReactDOM && typeof window.ReactDOM.createRoot === "function") {
        window.__HOME_MOUNTED__ = true;
        const reactRoot = ReactDOM.createRoot(rootElement);
        reactRoot.render(React.createElement(App));
      } else if (App && window.ReactDOM && typeof window.ReactDOM.render === "function") {
        window.__HOME_MOUNTED__ = true;
        ReactDOM.render(React.createElement(App), rootElement);
      } else {
        setTimeout(mountHomeApp, 50);
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", mountHomeApp);
    } else {
      mountHomeApp();
    }
  </script>

</body>
</html>
