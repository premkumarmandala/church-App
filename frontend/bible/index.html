<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Bible - King James Version &amp; Telugu పరిశుద్ధ గ్రంథము | Grace Church</title>
  <meta name="description" content="Grace Church Online Bible in English King James Version (KJV) and Telugu (పరిశుద్ధ గ్రంథము). Recreated in React with responsive components and modern aesthetics.">
  
  <!-- Typography matching design system -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Serif+Telugu:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Master Design Tokens & Bible Stylesheet -->
  <link rel="stylesheet" href="../design-tokens.css">
  <link rel="stylesheet" href="bible-react.css">
  
  <!-- React 18 & ReactDOM 18 from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for in-browser JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Canonical Mock Data (Runs as standard JS without CORS) -->
  <script src="mockData.js"></script>
</head>
<body>

  <!-- React Root Container -->
  <div id="root">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; color: #64748b; background: #f8f9fa;">
      <div style="text-align: center;">
        <div style="font-size: 2.2rem; margin-bottom: 12px; color: #0f1e36;">✝</div>
        <p style="font-size: 1.05rem; font-weight: 600; color: #0f1e36;">Loading Grace Church Bible...</p>
      </div>
    </div>
  </div>

  <!-- Service Worker Registration for Offline Reading -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/bible/sw.js', { scope: '/bible/' })
          .then(function(reg) {
            console.log('[Bible SW] Registered with scope:', reg.scope);
          })
          .catch(function(err) {
            console.warn('[Bible SW] Registration failed:', err);
          });
      });
    }
  </script>

  <!-- Modular React Functional Components (Single Source of Truth) -->
  <script type="text/babel" src="components/Sidebar.jsx"></script>
  <script type="text/babel" src="components/TopBar.jsx"></script>
  <script type="text/babel" src="components/DailyVerseHero.jsx"></script>
  <script type="text/babel" src="components/ViewTabs.jsx"></script>
  <script type="text/babel" src="components/PassageNavigation.jsx"></script>
  <script type="text/babel" src="components/ScriptureReader.jsx"></script>
  <script type="text/babel" src="components/SearchPanel.jsx"></script>
  <script type="text/babel" src="components/BookmarksPanel.jsx"></script>
  <script type="text/babel" src="components/OfflinePanel.jsx"></script>
  <script type="text/babel" src="BibleApp.jsx"></script>

  <!-- Mount Main Application -->
  <script type="text/babel">
    const rootElement = document.getElementById('root');
    if (rootElement) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(<BibleApp />);
    }
  </script>

</body>
</html>
